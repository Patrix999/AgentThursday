name = "agent-thursday"
main = "src/server.ts"
compatibility_date = "2026-04-20"
compatibility_flags = ["nodejs_compat"]

# single-user shared-secret auth (see docs/ops/auth.md).
#
#   AGENT_THURSDAY_SHARED_SECRET        : production secret. Set via:
#                                  wrangler secret put AGENT_THURSDAY_SHARED_SECRET
#                                Never write the value into this file.
#   AGENT_THURSDAY_ALLOW_INSECURE_DEV   : dev-only escape hatch. Allowed ONLY in local
#                                .dev.vars (gitignored). NEVER set in production
#                                via wrangler.toml, [env.production], dashboard,
#                                or `wrangler secret put` — worker will refuse
#                                all traffic with 503 if SECRET unset and this
#                                flag isn't "true".

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# web SPA served as static assets.
# Build: `npm run build:web` (root) emits to web/dist/.
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "AgentThursdayAgent"
class_name = "AgentThursdayAgent"

# separate ChannelHubAgent DO for inbox/outbox/identity/conversation.
# See  §1 — kept separate from AgentThursdayAgent
# from day 1 to avoid migration debt later.
[[durable_objects.bindings]]
name = "ChannelHubAgent"
class_name = "ChannelHubAgent"

# separate ContentHubAgent DO for provider-agnostic content
# source registry / future cache / future audit. Kept off AgentThursdayAgent so
# external Content Source state never leaks into agent event_log or Tier 0
# workspace storage. ADR:
[[durable_objects.bindings]]
name = "ContentHubAgent"
class_name = "ContentHubAgent"

# Cloudflare-native Discord Gateway runner. Outgoing
# WebSocket to gateway.discord.gg lives inside this DO instead of an
# external host process. Host-side `scripts/discord-gateway-runner.ts`
# remains shipped as a fallback per §F.
[[durable_objects.bindings]]
name = "DiscordGatewayAgent"
class_name = "DiscordGatewayAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentThursdayAgent"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Sandbox"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ChannelHubAgent"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["ContentHubAgent"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["DiscordGatewayAgent"]

# `AgentRunWorkflow` binding. `POST /api/agent-runs` mints an instance
# via `env.AGENT_RUN_WORKFLOW.create(...)` to drive a multi-step agent
# run as a durable Cloudflare Workflow.
[[workflows]]
name = "agent-run"
binding = "AGENT_RUN_WORKFLOW"
class_name = "AgentRunWorkflow"

# orchestration-as-code executor (descriptor-driven). Runs a validated
# phase/agent descriptor as a durable Cloudflare Workflow.
[[workflows]]
name = "workflow-executor"
binding = "WORKFLOW_EXECUTOR"
class_name = "WorkflowExecutor"

# Cloudflare Workers version metadata binding. Surfaces the current
# deploy's version id / tag / timestamp via `env.VERSION_METADATA`.
# Read-only, non-secret, automatically populated by the Workers runtime.
# Fail-soft: consumers return null fields if the binding is absent
# (local dev without the binding, or future shape drift).
[version_metadata]
binding = "VERSION_METADATA"

[ai]
binding = "AI"

# Discord direct adapter production config.
# Secrets still must be set with `wrangler secret put` and are intentionally
# not written here: AGENT_THURSDAY_SHARED_SECRET, DISCORD_BOT_TOKEN.
# DISCORD_PUBLIC_KEY is non-token config, but keep it unset here until copied
# from the Discord Developer Portal to avoid committing the wrong value.
[vars]
# Discord identifiers must be filled in per deployment. See DEPLOY.md for
# the Discord Developer Portal setup. Do NOT commit real Discord ids
# back into git — they identify a specific bot/user/channel and are not
# secrets in the cryptographic sense, but they are deployment-specific
# and may be sensitive depending on context.
AGENT_THURSDAY_DISCORD_BOT_ID = ""
DISCORD_APPLICATION_ID = ""
DISCORD_ALLOWED_USERS = ""
DISCORD_ALLOWED_CHANNELS = ""
DISCORD_IGNORE_NO_MENTION = "true"
DISCORD_ALLOW_BOTS = "mentions"

# Discord ingress mode.
#
#   gateway   (default) — DiscordGatewayAgent DO holds a persistent
#             WebSocket to gateway.discord.gg; real-time MESSAGE_CREATE
#             push, bot online/presence visible. Higher DO duration cost.
#   polling   — No WebSocket. The DO alarm wakes every
#             DISCORD_POLL_INTERVAL_SECONDS and fetches
#             /channels/{id}/messages?after={cursor} for each allowed
#             channel. Per-channel cursor is persisted. Lower duration
#             cost; first-message latency = poll interval; no presence.
#   disabled  — No WebSocket, no polling. /api/channel/discord/direct
#             still accepts external bridge / interaction ingestion.
#
# See DEPLOY.md for the full cost / latency / presence / rate-limit
# tradeoff table.
DISCORD_INGRESS_MODE = "gateway"
DISCORD_POLL_INTERVAL_SECONDS = "60"

# Discord user ids whose DM channels are polled in `polling` mode
# (gateway mode receives DMs via WS push so this var is ignored).
# Each id is resolved to a DM channel via REST `POST /users/@me/channels`
# (idempotent) and polled the same way as a guild channel, but with
# `chatType:"dm"`. Non-secret operational config; values are Discord
# snowflake user ids. Empty / unset → no DM polling.
DISCORD_POLL_DM_USER_IDS = ""

# dialogue pause-loop gate.
# Default OFF: diagnostics still log/surface `needs_human`, but the loop does not pause.
# Set to "true" to enable conversational pause/resume on current-task
# `degradation.summary.state === "needs_human"`.
AGENT_THURSDAY_PAUSE_ON_NEEDS_HUMAN = "false"

# tool truthfulness gate mode.
# Non-secret operational config. Modes:
#   "warn"      (default) — prepend a one-line ⚠️ Truthfulness warning
#                to the user-visible reply when the model claims tool
#                results that the trace does not back. Production
#                should keep this on.
#   "log-only"  — record `tool.truthfulness.violation` events but do
#                NOT prepend the warning. Diagnostic mode only;
#                useful when investigating false positives.
#   "off"       — disable detection entirely. Avoid in production.
# Lives here (not in `wrangler secret put`) so a `git diff` shows the
# current mode and `npm run deploy` is enough to roll changes; only
# real secrets (`AGENT_THURSDAY_SHARED_SECRET`, `DISCORD_BOT_TOKEN`,
# `DISCORD_PUBLIC_KEY`, `GITHUB_TOKEN`) go through `wrangler secret put`.
AGENT_THURSDAY_TRUTHFULNESS_GATE = "warn"

# per-turn inference loop step cap (Think SDK default is 10, which kills
# any real software-dev turn mid-work). Clamped to [10, 120].
AGENT_THURSDAY_TURN_MAX_STEPS = "48"

# AgentRunWorkflow multi-step orchestration tunables.
# AGENT_THURSDAY_AGENT_RUN_WAIT_TIMEOUT: duration string passed to
#   step.waitForEvent("user-reply", {timeout}). Default 24 hours.
#   Accepts Cloudflare's "<N> <unit>" grammar (e.g. "1 hour", "7 days").
#   Wall-clock during the pause is not billed; the upper bound is only
#   paid-tier state retention.
# AGENT_THURSDAY_AGENT_RUN_FORCE_PAUSE: dev/test-only env-flag fixture.
#   "true" makes every first-turn return status="awaiting_event" so the
#   multi-step + sendEvent branch can be exercised end-to-end. Must stay
#   "false" in production.
AGENT_THURSDAY_AGENT_RUN_WAIT_TIMEOUT = "24 hours"
AGENT_THURSDAY_AGENT_RUN_FORCE_PAUSE = "false"

# Optional sandbox repo-materialization overrides (set via
# `wrangler secret put` when used; not committed here):
#   AGENT_THURSDAY_REPO_URL    : git URL the dev-shell sandbox clones from.
#   AGENT_THURSDAY_GIT_TOKEN   : narrow-scope PAT for that clone (falls
#                                back to GITHUB_TOKEN). Never written here.

# debug surface mode for the Web UI.
#
#   enable    (default) Inspect entry, context chip / ContextRail, and debug
#             action buttons are all visible and executable. Current behaviour.
#   readonly  Inspect entry + context chip + ContextRail visible, navigation
#             still usable; debug action buttons render but their onClick
#             shows a readonly notice instead of hitting the API. Good for
#             safe demos.
#   disable   Inspect entry, context chip rail and any debug affordance
#             hidden in the UI; the chip itself stays visible (the
#             ContextIndicatorDialog stays available) and opens the
#             read-only Context indicator dialog. Direct `/inspect`
#             shows a disabled notice.
#
# Backend endpoints stay auth-gated regardless; this flag only controls the
# UI surface. Mode is exposed to the SPA via auth-gated `GET /api/config`
# so flipping mode is a `wrangler deploy` away — no web rebuild required.
AGENT_THURSDAY_DEBUG_SURFACE_MODE = "readonly"

# npx wrangler secret put DISCORD_BOT_TOKEN
# npx wrangler secret put DISCORD_PUBLIC_KEY

# Cloudflare Browser Rendering binding for the Tier 3 `browse` tool.
# Routes via env.BROWSER.fetch("https://localhost/v1/devtools/browser") to open
# a CDP WebSocket. Local `wrangler dev` cannot fully back this; remote deploy
# (`wrangler deploy`) connects to the real Browser Rendering service.
[browser]
binding = "BROWSER"

[[worker_loaders]]
binding = "LOADER"

# Tier 4: Cloudflare container sandbox — requires Cloudflare Containers beta access
[[durable_objects.bindings]]
name = "Sandbox"
class_name = "Sandbox"

[[containers]]
class_name = "Sandbox"
image = "./Dockerfile"
instance_type = "lite"
# bumped from 1 to 3 so verifier / parallel work can use distinct
# `sandbox_id`s without the second one queueing forever behind the
# first. Each instance is the smallest tier, so the cost ceiling
# stays low even at 3 simultaneous containers.
max_instances = 3
